# The research server, PostgreSQL and Caddy (HTTPS) on one machine in the EU (M10.6, M10.7).
# Copy .env.example to .env and fill it in, then from the repository root:
#   docker compose -f server/docker-compose.yml --env-file server/.env up -d
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not reachable from outside: only the server talks to it.

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/research
      DATABASE_USER: research
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PORT: "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      RESEARCH_DOMAIN: ${RESEARCH_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  db-data:
  caddy-data:
